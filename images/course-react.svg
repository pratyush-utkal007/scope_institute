<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1526"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="react-glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00D8FE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00D8FE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimson-glow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#D39B3A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#041934" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>
  <rect width="1200" height="675" fill="url(#react-glow)"/>
  <rect width="1200" height="675" fill="url(#crimson-glow)"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Left Code Editor Window -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect width="640" height="520" rx="16" fill="#0E131F" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="640" height="42" rx="16" fill="#151C2C"/>
    <rect y="30" width="640" height="12" fill="#151C2C"/>
    
    <!-- Window Controls -->
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>

    <!-- Tabs -->
    <rect x="80" y="8" width="130" height="26" rx="6" fill="#0E131F"/>
    <text x="100" y="25" fill="#00D8FE" font-family="monospace" font-size="11" font-weight="600">App.jsx</text>
    <rect x="220" y="8" width="140" height="26" rx="6" fill="#151C2C"/>
    <text x="235" y="25" fill="#64748B" font-family="monospace" font-size="11">CoursePortal.jsx</text>
    
    <!-- Line numbers & Code -->
    <g font-family="monospace" font-size="13" line-height="1.7">
      <!-- Line Numbers -->
      <g fill="#334155" text-anchor="end">
        <text x="35" y="75">1</text>
        <text x="35" y="102">2</text>
        <text x="35" y="129">3</text>
        <text x="35" y="156">4</text>
        <text x="35" y="183">5</text>
        <text x="35" y="210">6</text>
        <text x="35" y="237">7</text>
        <text x="35" y="264">8</text>
        <text x="35" y="291">9</text>
        <text x="35" y="318">10</text>
        <text x="35" y="345">11</text>
        <text x="35" y="372">12</text>
        <text x="35" y="399">13</text>
        <text x="35" y="426">14</text>
        <text x="35" y="453">15</text>
      </g>

      <!-- Code Syntax Highlighting -->
      <g>
        <text x="55" y="75"><tspan fill="#F43F5E">import</tspan> <tspan fill="#F8FAFC">React, { useState, useEffect } </tspan><tspan fill="#F43F5E">from</tspan> <tspan fill="#34D399">'react'</tspan>;</text>
        <text x="55" y="102"><tspan fill="#F43F5E">import</tspan> <tspan fill="#38BDF8">{ CourseCard, EnquiryModal } </tspan><tspan fill="#F43F5E">from</tspan> <tspan fill="#34D399">'./components'</tspan>;</text>
        <text x="55" y="129"></text>
        <text x="55" y="156"><tspan fill="#818CF8">export default function</tspan> <tspan fill="#FBBF24">ScopeApp</tspan>() {</text>
        <text x="75" y="183"><tspan fill="#818CF8">const</tspan> [<tspan fill="#38BDF8">tracks</tspan>, <tspan fill="#38BDF8">setTracks</tspan>] = <tspan fill="#00D8FE">useState</tspan>([]);</text>
        <text x="75" y="210"><tspan fill="#818CF8">const</tspan> [<tspan fill="#38BDF8">activeEnrollment</tspan>, <tspan fill="#38BDF8">setActive</tspan>] = <tspan fill="#00D8FE">useState</tspan>(<tspan fill="#F43F5E">null</tspan>);</text>
        <text x="75" y="237"></text>
        <text x="75" y="264"><tspan fill="#00D8FE">useEffect</tspan>(() =&gt; {</text>
        <text x="95" y="291"><tspan fill="#F8FAFC">fetchScopeCourses().</tspan><tspan fill="#60A5FA">then</tspan>(<tspan fill="#38BDF8">data</tspan> =&gt; <tspan fill="#38BDF8">setTracks</tspan>(<tspan fill="#38BDF8">data</tspan>));</text>
        <text x="75" y="318">}, []);</text>
        <text x="75" y="345"></text>
        <text x="75" y="372"><tspan fill="#818CF8">return</tspan> (</text>
        <text x="95" y="399">&lt;<tspan fill="#38BDF8">main</tspan> <tspan fill="#FBBF24">className</tspan>=<tspan fill="#34D399">"scope-react-portal"</tspan>&gt;</text>
        <text x="115" y="426">&lt;<tspan fill="#00D8FE">CourseGrid</tspan> <tspan fill="#FBBF24">items</tspan>={<tspan fill="#38BDF8">tracks</tspan>} <tspan fill="#FBBF24">onSelect</tspan>={<tspan fill="#38BDF8">setActive</tspan>} /&gt;</text>
        <text x="95" y="453">&lt;/<tspan fill="#38BDF8">main</tspan>&gt;</text>
        <text x="75" y="480">);</text>
        <text x="55" y="500">}</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Preview & React Atom Card -->
  <g transform="translate(730, 60)" filter="url(#shadow)">
    <!-- Right Card Frame -->
    <rect width="410" height="520" rx="16" fill="#0E131F" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header Pill -->
    <rect x="25" y="25" width="360" height="48" rx="12" fill="#151C2C" stroke="#1E293B" stroke-width="1"/>
    <circle cx="50" cy="49" r="7" fill="#10B981"/>
    <text x="68" y="53" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">React 19 • Single Page Application</text>
    <rect x="310" y="38" width="60" height="22" rx="6" fill="#00D8FE" fill-opacity="0.15"/>
    <text x="323" y="53" fill="#00D8FE" font-family="sans-serif" font-size="10" font-weight="800">LIVE</text>

    <!-- Glowing Animated React Atom Graphic -->
    <g transform="translate(205, 190)">
      <!-- Orbital Ring 1 -->
      <ellipse rx="90" ry="32" fill="none" stroke="#00D8FE" stroke-width="3" opacity="0.85" transform="rotate(0)"/>
      <!-- Orbital Ring 2 -->
      <ellipse rx="90" ry="32" fill="none" stroke="#00D8FE" stroke-width="3" opacity="0.85" transform="rotate(60)"/>
      <!-- Orbital Ring 3 -->
      <ellipse rx="90" ry="32" fill="none" stroke="#00D8FE" stroke-width="3" opacity="0.85" transform="rotate(120)"/>
      <!-- Nucleus -->
      <circle r="14" fill="#00D8FE"/>
      <circle r="22" fill="#00D8FE" opacity="0.3"/>
    </g>

    <!-- Live Component Output Card -->
    <g transform="translate(25, 290)">
      <rect width="360" height="195" rx="14" fill="#151C2C" stroke="#334155" stroke-width="1"/>
      <text x="20" y="35" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="700">Production UI Components</text>
      <text x="20" y="55" fill="#94A3B8" font-family="sans-serif" font-size="11">Virtual DOM • State Hooks • Clean Routing</text>
      
      <!-- Mini Sub Card 1 -->
      <rect x="20" y="75" width="320" height="45" rx="8" fill="#0E131F" stroke="#1E293B" stroke-width="1"/>
      <rect x="32" y="87" width="22" height="22" rx="5" fill="#D39B3A"/>
      <text x="65" y="99" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Component State: Synchronized</text>
      <text x="65" y="112" fill="#64748B" font-family="sans-serif" font-size="9">useContext &amp; Custom Reducer Hooks</text>

      <!-- Mini Sub Card 2 -->
      <rect x="20" y="130" width="320" height="45" rx="8" fill="#0E131F" stroke="#1E293B" stroke-width="1"/>
      <rect x="32" y="142" width="22" height="22" rx="5" fill="#00D8FE"/>
      <text x="65" y="154" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">SPA Router: 0ms Latency</text>
      <text x="65" y="167" fill="#64748B" font-family="sans-serif" font-size="9">Dynamic Route Loading &amp; Code Splitting</text>
    </g>
  </g>
</svg>
